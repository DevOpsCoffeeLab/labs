# Solution de référence — n'y jette un œil qu'après avoir essayé sérieusement.
apiVersion: v1
kind: Pod
metadata:
  name: web-with-logger
  namespace: devopscoffeelab-lab01
  labels:
    app: devopscoffeelab-lab01
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}

  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/shared

    - name: logger
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date -Iseconds) - requête simulée traitée" >> /var/log/shared/access.log
            sleep 5
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/shared
