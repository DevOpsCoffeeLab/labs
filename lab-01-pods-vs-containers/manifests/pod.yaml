apiVersion: v1
kind: Pod
metadata:
  name: web-with-logger
  namespace: devopscoffeelab-lab01
  labels:
    app: devopscoffeelab-lab01
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}

  containers:
    # Conteneur principal : sert du contenu web
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/shared

    # Conteneur sidecar : à toi de compléter sa commande
    - name: logger
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
